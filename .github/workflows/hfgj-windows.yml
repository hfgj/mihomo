name: HFGJ Core

on:
  push:
    branches: [hfgj]
  workflow_dispatch:
    inputs:
      publish:
        description: Promote tested Meta merge and publish HFGJ Stable
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hfgj-stable-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'hfgj/mihomo' && github.ref == 'refs/heads/hfgj'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      version: ${{ steps.meta.outputs.version }}
      build_time: ${{ steps.meta.outputs.build_time }}
      changed: ${{ steps.meta.outputs.changed }}
      release_needed: ${{ steps.meta.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check maintenance logic before merging upstream
        run: |
          python3 -B -m unittest discover -s .github/scripts/tests -v
          for script in .github/scripts/hfgj-sync-upstream.sh .github/scripts/hfgj-setup-go.sh; do bash -n "$script" || exit; done
      - name: Lock Meta merge without changing official refs
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/hfgj-sync-upstream.sh prepare --locked "$RUNNER_TEMP/hfgj-locked"
      - uses: actions/upload-artifact@v7
        with:
          name: hfgj-locked-source
          path: ${{ runner.temp }}/hfgj-locked/
          if-no-files-found: error

  verify:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: hfgj-locked-source
          path: ${{ runner.temp }}/hfgj-locked
      - name: Check out the locked merge candidate
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          git fetch "$RUNNER_TEMP/hfgj-locked/source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
      - name: Set up digest-pinned MetaCubeX Go
        run: bash .github/scripts/hfgj-setup-go.sh
      - name: Full affected-package regression, including HFGJ and upstream tests
        env:
          CGO_ENABLED: '1'
          GOTOOLCHAIN: local
        run: |
          go test -race -tags with_gvisor ./adapter/provider ./adapter/outbound ./component/resolver ./component/resource ./component/updater ./config ./dns ./listener/sing_tun ./component/dialer ./transport/anytls/session -count=1
          go test -tags with_gvisor ./component/updater -run TestHFGJLinkedCoreSource -count=1 -ldflags '-X github.com/metacubex/mihomo/component/updater.HFGJReleaseBaseURL=https://github.com/hfgj/mihomo/releases/download/HFGJ-Stable/'

  build:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: amd64, goamd64: v2, asset: mihomo-windows-amd64-v2, extension: zip}
          - {os: windows, arch: arm64, goamd64: '', asset: mihomo-windows-arm64, extension: zip}
          - {os: linux, arch: arm64, goamd64: '', asset: mihomo-linux-arm64, extension: gz}
          - {os: darwin, arch: arm64, goamd64: '', asset: mihomo-darwin-arm64, extension: gz}
          - {os: darwin, arch: amd64, goamd64: v1, asset: mihomo-darwin-amd64-v1, extension: gz}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: hfgj-locked-source
          path: ${{ runner.temp }}/hfgj-locked
      - name: Check out the locked merge candidate
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          git fetch "$RUNNER_TEMP/hfgj-locked/source.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
      - name: Set up digest-pinned MetaCubeX Go
        run: bash .github/scripts/hfgj-setup-go.sh
      - name: Build using locked source time and committed CA bundle
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM64: v8.0
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILDTIME: ${{ needs.prepare.outputs.build_time }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          BINARY="$ASSET"
          if [ "$GOOS" = windows ]; then BINARY="$BINARY.exe"; fi
          go build -tags with_gvisor -trimpath \
            -ldflags "-extldflags --static -X github.com/metacubex/mihomo/constant.Version=$VERSION -X github.com/metacubex/mihomo/constant.BuildTime=$BUILDTIME -X github.com/metacubex/mihomo/component/updater.HFGJReleaseBaseURL=https://github.com/hfgj/mihomo/releases/download/HFGJ-Stable/ -w -s -buildid=" \
            -o "$BINARY"
          python3 .github/scripts/hfgj-package-core.py "$BINARY" "$VERSION" --output bin
      - uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.asset }}
          path: bin/${{ matrix.asset }}-${{ needs.prepare.outputs.version }}.${{ matrix.extension }}
          if-no-files-found: error

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: hfgj-locked-source
          path: ${{ runner.temp }}/hfgj-locked
      - uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: bin
      - name: Inspect every package and generate manifest
        run: python3 .github/scripts/hfgj-release.py assemble --locked "$RUNNER_TEMP/hfgj-locked" --packages bin
      - uses: actions/upload-artifact@v7
        with:
          name: hfgj-release-preview
          path: bin/
          if-no-files-found: error

  promote:
    needs: [prepare, assemble]
    if: inputs.publish || (github.event_name == 'push' && vars.HFGJ_AUTO_PUBLISH == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: hfgj-locked-source
          path: ${{ runner.temp }}/hfgj-locked
      - name: Atomically fast-forward Meta and promote this tested candidate
        run: bash .github/scripts/hfgj-sync-upstream.sh promote --locked "$RUNNER_TEMP/hfgj-locked"

  publish:
    needs: [prepare, promote]
    if: needs.prepare.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: hfgj-locked-source
          path: ${{ runner.temp }}/hfgj-locked
      - uses: actions/download-artifact@v8
        with:
          name: hfgj-release-preview
          path: bin
      - name: Publish these exact packages; preserve old channel on failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/hfgj-release.py publish --locked "$RUNNER_TEMP/hfgj-locked" --packages bin --backup "$RUNNER_TEMP/hfgj-channel-recovery"
      - name: Keep public channel recovery metadata even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hfgj-channel-recovery
          path: ${{ runner.temp }}/hfgj-channel-recovery/
          if-no-files-found: warn
